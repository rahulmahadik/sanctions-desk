name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Fails the build on a known high or critical vulnerability in a dependency.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # The Meterless conformance suites (vendored) against our engines; the scorecards show in the log.
      - run: npm run test:engines
      - name: Signed evidence and documented file changes of the exported runs
        run: npm run evidence:verify && npm run evidence:hash-changes
      - run: npm run readme:refresh -- --check
      - name: The safety guard result in the docs matches its committed result file
        run: npm run adversarial:summary -- --check
      - name: The data-harness counts in docs/ZETARIS.md match the code
        run: npm run zetaris:harness -- --check
      - name: The Nemotron scorecard in docs/NEMOTRON.md matches the committed files
        run: npm run nemotron:scorecard -- --check
      # Every relative link, image and #anchor in the tracked Markdown files resolves.
      - run: npm run check:links

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag sanctions-desk-api:ci .
