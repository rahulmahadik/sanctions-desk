name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Fails the build on a known high or critical vulnerability in a dependency.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # The Meterless conformance suites (vendored) against our engines; the scorecards show in the log.
      - run: npm run test:engines
      - run: npm run readme:refresh -- --check
      # Every relative link, image and #anchor in the tracked Markdown files resolves.
      - run: npm run check:links

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --tag sanctions-desk-api:ci .
