name: API docs (Pages)

# Publishes site/ to GitHub Pages: a landing page, the API reference (Redoc) over the OpenAPI document, which is
# generated from the API's own code on every build so it never goes stale, and the "Recorded runs" replay pages built
# from the committed run exports, and the receipt log of every model call in them (the build fails if a receipt is
# missing or does not verify). Static only: nothing calls the API.
# Both jobs are skipped while the repository is private; they run on the first matching push after it is public,
# once Settings > Pages > Source is set to "GitHub Actions" (see docs/API.md).

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "site/**"
      - "docs/media/**"
      - "tools/build-site.ts"
      - "tools/export-openapi.ts"
      - "tools/lib/site.ts"
      - "tools/lib/runs-site.ts"
      - "tools/lib/receipt-log.ts"
      - "tools/lib/results-page.ts"
      - "README.md"
      - "docs/EVALUATION.md"
      - "docs/NEMOTRON.md"
      - "tools/lib/evidence.ts"
      - "tools/lib/hash-changes.ts"
      # The "Recorded runs" pages are replayed from these committed files.
      - "eval/runs/**"
      - "eval/cases/**"
      - "output_examples/**"
      - "data/sample/**"
      - "data/synthetic/**"
      - "packages/shared/src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Each job gets only what it needs: the build job (which runs npm ci) reads the repository; only the deploy job may
# publish to Pages.
permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs site
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
