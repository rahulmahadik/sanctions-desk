<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sanctions Desk architecture</title>
  <desc>An alert flows through triage, evidence (read only through the Zetaris semantic layer), a local Nemotron safety guard and free-text screener, matching and memory, a cloud Nemotron decision, critic and challenger through Meterless Nightshift, a raise-only policy guard and a sealed record, to a person who approves or overrides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.5; rx: 10; }
      .step { fill: #f9fafb; stroke: #667085; stroke-width: 1.5; rx: 8; }
      .local { fill: #ecfdf3; stroke: #12b76a; stroke-width: 1.5; rx: 8; }
      .cloud { fill: #eff8ff; stroke: #2e90fa; stroke-width: 1.5; rx: 8; }
      .guard { fill: #fffaeb; stroke: #f79009; stroke-width: 1.5; rx: 8; }
      .human { fill: #f4f3ff; stroke: #7a5af8; stroke-width: 2; rx: 10; }
      .data { fill: #fdf2fa; stroke: #dd2590; stroke-width: 1.5; rx: 10; }
      .t { font-size: 15px; font-weight: 600; fill: #101828; }
      .s { font-size: 12.5px; fill: #475467; }
      .h { font-size: 13px; font-weight: 700; fill: #344054; letter-spacing: 0.04em; }
      .line { stroke: #475467; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #98a2b3; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#101828">Sanctions Desk: one alert, from data to a person's decision</text>
  <text x="40" y="68" class="s">Every step is logged with its agent, action, model asked for, model that served it, and signed receipt. The desk recommends; a person decides.</text>

  <!-- Data layer -->
  <rect x="40" y="96" width="250" height="300" class="data"/>
  <text x="58" y="124" class="h">DATA (READ ONLY)</text>
  <text x="58" y="152" class="t">Zetaris</text>
  <text x="58" y="172" class="s">Unified Semantic Layer:</text>
  <text x="58" y="190" class="s">the only data path for agents</text>
  <text x="58" y="214" class="s">• bank tables (synthetic customers,</text>
  <text x="58" y="232" class="s">  payments, owners, alerts)</text>
  <text x="58" y="250" class="s">• public lists (OFAC, UN), GLEIF</text>
  <text x="58" y="268" class="s">• per-agent allow-lists, masked IDs,</text>
  <text x="58" y="286" class="s">  data-quality rules</text>
  <text x="58" y="310" class="s">• document-on-record check:</text>
  <text x="58" y="328" class="s">  a count inside Zetaris, the</text>
  <text x="58" y="346" class="s">  number never leaves it</text>
  <text x="58" y="374" class="s">Approved definitions, versioned</text>

  <!-- Pipeline column 1: triage, evidence -->
  <rect x="340" y="110" width="200" height="56" class="step"/>
  <text x="356" y="134" class="t">Triage</text>
  <text x="356" y="153" class="s">first finding from code</text>
  <rect x="340" y="186" width="200" height="56" class="step"/>
  <text x="356" y="210" class="t">Evidence</text>
  <text x="356" y="229" class="s">reads through Zetaris</text>
  <path d="M290 214 L338 214" class="dash"/>
  <path d="M440 166 L440 184" class="line"/>

  <!-- Local box -->
  <rect x="320" y="270" width="240" height="196" class="box"/>
  <text x="336" y="294" class="h">ON THE LAPTOP</text>
  <rect x="336" y="304" width="208" height="70" class="local"/>
  <text x="350" y="327" class="t">Safety guard</text>
  <text x="350" y="346" class="s">Nemotron 3.5 Lightning 30B</text>
  <text x="350" y="363" class="s">flags instructions in the data</text>
  <rect x="336" y="384" width="208" height="70" class="local"/>
  <text x="350" y="407" class="t">Free-text screener</text>
  <text x="350" y="426" class="s">Nemotron 3.5 Lightning 30B</text>
  <text x="350" y="443" class="s">signals with exact span; text stays</text>
  <path d="M510 242 L510 302" class="line"/>

  <!-- Matching, memory -->
  <rect x="610" y="110" width="210" height="56" class="step"/>
  <text x="626" y="134" class="t">Matching or ownership</text>
  <text x="626" y="153" class="s">names, IDs; World Model owners</text>
  <rect x="610" y="186" width="210" height="56" class="step"/>
  <text x="626" y="210" class="t">Memory (H-MEM)</text>
  <text x="626" y="229" class="s">earlier decisions, go stale</text>
  <path d="M562 420 C 590 420, 585 140, 608 138" class="line"/>
  <path d="M715 166 L715 184" class="line"/>

  <!-- Cloud box -->
  <rect x="590" y="270" width="250" height="276" class="box"/>
  <text x="606" y="294" class="h">CLOUD, VIA NIGHTSHIFT</text>
  <text x="606" y="312" class="s">facts only, no raw text; a signed receipt</text>
  <rect x="606" y="322" width="218" height="58" class="cloud"/>
  <text x="620" y="345" class="t">Decision</text>
  <text x="620" y="364" class="s">Nemotron 3 Ultra 550B (mostly)</text>
  <rect x="606" y="396" width="218" height="58" class="cloud"/>
  <text x="620" y="419" class="t">Critic</text>
  <text x="620" y="438" class="s">re-reads every cited fact; ≤ 3 rounds</text>
  <rect x="606" y="470" width="218" height="58" class="cloud"/>
  <text x="620" y="493" class="t">Challenger</text>
  <text x="620" y="512" class="s">argues against a close</text>
  <path d="M800 242 L800 320" class="line"/>
  <path d="M715 380 L715 394" class="line"/>
  <path d="M715 454 L715 468" class="line"/>
  <path d="M290 330 C 470 600, 560 470, 604 434" class="dash"/>
  <text x="300" y="520" class="s">critic re-reads facts from Zetaris</text>

  <!-- Policy guard, reporter -->
  <rect x="890" y="300" width="260" height="78" class="guard"/>
  <text x="906" y="326" class="t">Policy guard</text>
  <text x="906" y="346" class="s">raise-only: any signal at or above its</text>
  <text x="906" y="364" class="s">threshold blocks a close (fails closed)</text>
  <rect x="890" y="398" width="260" height="62" class="step"/>
  <text x="906" y="423" class="t">Reporter</text>
  <text x="906" y="442" class="s">sealed record: data, model, receipts</text>
  <path d="M826 500 C 860 500, 860 340, 888 340" class="line"/>
  <path d="M1020 378 L1020 396" class="line"/>

  <!-- Human -->
  <rect x="890" y="500" width="260" height="120" class="human"/>
  <text x="906" y="526" class="h">A PERSON DECIDES</text>
  <text x="906" y="550" class="t">Analyst or senior reviewer</text>
  <text x="906" y="572" class="s">approve or override, with a reason</text>
  <text x="906" y="590" class="s">a block needs two people</text>
  <text x="906" y="608" class="s">next action prepared, never sent</text>
  <path d="M1020 460 L1020 498" class="line"/>

  <!-- Never -->
  <rect x="40" y="610" width="800" height="110" class="box"/>
  <text x="58" y="636" class="h">NEVER, BY DESIGN</text>
  <text x="58" y="662" class="s">• never blocks an account, never writes to a source system, never messages a customer (fixed in the policy schema)</text>
  <text x="58" y="684" class="s">• a failed screener, a missing fact or a critic deadlock escalates; it never closes</text>
  <text x="58" y="706" class="s">• no model is pinned here: Nightshift's router chooses, and each signed receipt records the model that served the call</text>

  <!-- Legend -->
  <rect x="890" y="650" width="16" height="16" class="local"/><text x="914" y="663" class="s">local Nemotron</text>
  <rect x="1020" y="650" width="16" height="16" class="cloud"/><text x="1044" y="663" class="s">cloud Nemotron</text>
  <rect x="890" y="680" width="16" height="16" class="guard"/><text x="914" y="693" class="s">code rule</text>
  <rect x="1020" y="680" width="16" height="16" class="data"/><text x="1044" y="693" class="s">Zetaris data</text>
</svg>
