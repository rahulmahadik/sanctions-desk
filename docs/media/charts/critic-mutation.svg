<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Critic fact re-check: mutation test</title>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="90" y="110" font-size="54" fill="#1f2937" font-weight="700" text-anchor="start">Critic fact re-check: mutation test</text>
<text x="90" y="170" font-size="32" fill="#4b5563" font-weight="400" text-anchor="start">Sample mode, deterministic; re-run with npm run critic:mutation or npm run prove.</text>
<text x="90" y="330" font-size="42" fill="#1f2937" font-weight="600" text-anchor="start">Changed facts caught (cited facts changed to false values)</text><rect x="90" y="360" width="1740" height="90" fill="#e5e7eb" rx="10"/><rect x="90" y="360" width="1740" height="90" fill="#1d4ed8" rx="10"/><text x="120" y="422" font-size="48" fill="#ffffff" font-weight="700" text-anchor="start">147 of 147</text><text x="90" y="620" font-size="42" fill="#1f2937" font-weight="600" text-anchor="start">Unchanged decisions approved (no false alarm)</text><rect x="90" y="650" width="1740" height="90" fill="#e5e7eb" rx="10"/><rect x="90" y="650" width="1740" height="90" fill="#047857" rx="10"/><text x="120" y="712" font-size="48" fill="#ffffff" font-weight="700" text-anchor="start">25 of 25</text><text x="90" y="900" font-size="30" fill="#4b5563" font-weight="400" text-anchor="start">25 recorded decisions; each cited fact changed to a false value, one at a time, then re-checked by the critic's code.</text><text x="90" y="945" font-size="30" fill="#4b5563" font-weight="400" text-anchor="start">25 cited facts could not be checked in sample mode and are not counted.</text>
<text x="90" y="1035" font-size="26" fill="#4b5563" font-weight="400" text-anchor="start">Source: eval/critic-mutation.json</text>
