<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Proposed closes on risk cases, and how many were stopped</title>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="90" y="110" font-size="54" fill="#1f2937" font-weight="700" text-anchor="start">Proposed closes on risk cases, and how many were stopped</text>
<text x="90" y="170" font-size="32" fill="#4b5563" font-weight="400" text-anchor="start">From the traces: the decision step's first recommendation on each case that must not be closed, against the final outcome.</text>
