xt><text x="530" y="718" font-size="32" fill="#1f2937" font-weight="600" text-anchor="end">Held-out v2 (re-run)</text><rect x="560" y="684" width="3" height="26" fill="#9ca3af" rx="3"/><rect x="560" y="715" width="3" height="26" fill="#047857" rx="3"/><text x="584" y="726" font-size="30" fill="#1f2937" font-weight="700" text-anchor="start">none proposed</text><text x="530" y="794" font-size="32" fill="#1f2937" font-weight="600" text-anchor="end">Held-out v3</text><rect x="560" y="760" width="3" height="26" fill="#9ca3af" rx="3"/><rect x="560" y="791" width="3" height="26" fill="#047857" rx="3"/><text x="584" y="802" font-size="30" fill="#1f2937" font-weight="700" text-anchor="start">none proposed</text><text x="530" y="870" font-size="32" fill="#1f2937" font-weight="600" text-anchor="end">Held-out v4</text><rect x="560" y="836" width="3" height="26" fill="#9ca3af" rx="3"/><rect x="560" y="867" width="3" height="26" fill="#047857" rx="3"/><text x="584" y="878" font-size="30" fill="#1f2937" font-weight="700" text-anchor="start">none proposed</text><text x="90" y="940" font-size="25" fill="#4b5563" font-weight="400" text-anchor="start">70 cases, first system: 6 of 6 with the current labels (5 of 5 as run; EX-043 relabelled must-not-close after the run).</text><text x="90" y="980" font-size="25" fill="#4b5563" font-weight="400" text-anchor="start">Held-out v3: no first recommendation was a close; its two wrong closes came after the critic sent an escalation back.</text>
<text x="90" y="1035" font-size="26" fill="#4b5563" font-weight="400" text-anchor="start">Source: eval/runs/*/trace.jsonl.gz and results.json, scored with the labels in eval/cases/exam.json</text>
