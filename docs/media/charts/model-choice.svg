<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Reasoning steps: Ultra in the cloud or Lightning locally</title>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="90" y="110" font-size="54" fill="#1f2937" font-weight="700" text-anchor="start">Reasoning steps: Ultra in the cloud or Lightning locally</text>
<text x="90" y="170" font-size="32" fill="#4b5563" font-weight="400" text-anchor="start">Decision, critic and challenger. Small study, not part of the recorded evaluation: 20 cases, one run per arm.</text>
<text x="760" y="300" font-size="40" fill="#6d28d9" font-weight="700" text-anchor="middle">Ultra arm (default)</text><text x="1340" y="300" font-size="40" fill="#0e7490" font-weight="700" text-anchor="middle">Lightning arm</text><line x1="90" x2="1830" y1="338" y2="338" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="400" font-size="36" fill="#1f2937" font-weight="600" text-anchor="start">Risk cases wrongly closed</text><text x="760" y="400" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">0 of 10</text><text x="1340" y="400" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">0 of 10</text><line x1="90" x2="1830" y1="448" y2="448" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="510" font-size="36" fill="#1f2937" font-weight="600" text-anchor="start">Clears made</text><text x="760" y="510" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">3 of 10</text><text x="1340" y="510" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">1 of 10</text><line x1="90" x2="1830" y1="558" y2="558" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="620" font-size="36" fill="#1f2937" font-weight="600" text-anchor="start">Same outcome as the default</text><text x="760" y="620" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">20 of 20</text><text x="1340" y="620" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">10 of 20</text><line x1="90" x2="1830" y1="668" y2="668" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="730" font-size="36" fill="#1f2937" font-weight="600" text-anchor="start">Cases with no usable decision</text><text x="760" y="730" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">0</text><text x="1340" y="730" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">4</text><line x1="90" x2="1830" y1="778" y2="778" stroke="#e5e7eb" stroke-width="2"/><text x="90" y="840" font-size="36" fill="#1f2937" font-weight="600" text-anchor="start">Median time per case</text><text x="760" y="840" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">110 s</text><text x="1340" y="840" font-size="40" fill="#1f2937" font-weight="700" text-anchor="middle">385 s</text>
<text x="90" y="1035" font-size="26" fill="#4b5563" font-weight="400" text-anchor="start">Source: eval/model-choice.json (npm run study:model-choice)</text>
</svg>
